name: Update visual baselines

# Run by hand from the Actions tab on a branch; commits new screenshots for review in the PR.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:docs
      - run: npx playwright test -c tests/visual --update-snapshots
        env:
          CI: '1'
          HOME: /root
      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          git diff --cached --quiet || git commit -m "test: update visual baselines"
          git push
